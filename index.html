<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ابزار جامع بانکی و مالی</title>
    <style>
        :root { --teal: #0E6B57; --paper: #F4F4F9; }
        body { font-family: Tahoma, sans-serif; background: var(--paper); padding: 15px; color: #333; margin: 0; }
        .wrap { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--teal); font-size: 1.2rem; }
        label { font-size: 0.85rem; font-weight: bold; margin-top: 10px; display: block; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-family: Tahoma; }
        button { background: var(--teal); color: white; border: none; font-weight: bold; cursor: pointer; }
        .result { margin-top: 15px; padding: 15px; background: #eef; border-radius: 8px; font-size: 0.9rem; line-height: 1.8; }
    </style>
</head>
<body>

<div class="wrap">
    <h1>ابزار جامع بانکی</h1>

    <!-- تشخیص بانک -->
    <label>تشخیص بانک (۶ رقم اول کارت):</label>
    <input type="text" id="binCard" maxlength="6" placeholder="۶ رقم اول کارت" oninput="checkBank()">
    <div id="bankResult" style="color:var(--teal); font-weight:bold; font-size: 0.9rem;"></div>

    <hr>

    <!-- محاسبات وام -->
    <label>نوع وام:</label>
    <select id="loanType" onchange="toggleLoanFields()">
        <option value="install">وام اقساطی</option>
        <option value="lump">وام یکجا پرداخت</option>
        <option value="qarz">وام قرض‌الحسنه</option>
    </select>
    <input type="text" id="loanAmount" placeholder="مبلغ وام (تومان)" oninput="formatNumber(this)">
    <div id="extraFields">
        <input type="number" id="loanMonths" placeholder="تعداد اقساط / مدت (ماه)">
    </div>
    <button onclick="calculateLoan()">محاسبه وام</button>
    <div id="loanResult" class="result" style="display:none;"></div>

    <hr>

    <!-- سود سپرده -->
    <label>مبلغ سپرده (تومان):</label>
    <input type="text" id="depAmount" placeholder="مبلغ سپرده" oninput="formatNumber(this)">
    <label>نرخ سود سالانه (%):</label>
    <input type="number" id="depRate" value="20">
    <button onclick="calculateDeposit()">محاسبه سود سپرده</button>
    <div id="depResult" class="result" style="display:none;"></div>
</div>

<script>
    function formatNumber(input) {
        let val = input.value.replace(/,/g, '');
        if (!isNaN(val) && val !== "") {
            input.value = Number(val).toLocaleString('fa-IR');
        }
    }

    function checkBank() {
        const bin = document.getElementById('binCard').value;
        const banks = { "603799": "بانک ملی", "589210": "بانک سپه", "627381": "بانک انصار", "627412": "بانک اقتصاد نوین" };
        document.getElementById('bankResult').innerText = banks[bin] || (bin.length === 6 ? "بانک نامشخص" : "");
    }

    function toggleLoanFields() {
        const type = document.getElementById('loanType').value;
        document.getElementById('extraFields').style.display = (type === 'lump') ? 'none' : 'block';
    }

    function calculateLoan() {
        const p = parseInt(document.getElementById('loanAmount').value.replace(/,/g, ''));
        const type = document.getElementById('loanType').value;
        const n = parseInt(document.getElementById('loanMonths').value);
        let res = "";

        if (type === 'qarz') {
            const fee = p * 0.04; // کارمزد 4 درصد ساده
            res = `کارمزد (۴٪): ${Math.round(fee).toLocaleString()} تومان<br>قسط ماهانه: ${Math.round((p+fee)/n).toLocaleString()} تومان`;
        } else if (type === 'install') {
            res = `قسط ماهانه: ${Math.round((p * 1.23) / n).toLocaleString()} تومان`;
        } else {
            res = "وام یکجا در پایان دوره سررسید می‌شود.";
        }
        
        document.getElementById('loanResult').innerHTML = res;
        document.getElementById('loanResult').style.display = 'block';
    }

    function calculateDeposit() {
        const p = parseInt(document.getElementById('depAmount').value.replace(/,/g, ''));
        const r = parseFloat(document.getElementById('depRate').value) / 100;
        
        document.getElementById('depResult').innerHTML = `
            سود روزانه: ${Math.round((p * r) / 365).toLocaleString()} ریال<br>
            سود ماه ۲۹ روزه: ${Math.round((p * r * 29) / 365).toLocaleString()} ریال<br>
            سود ماه ۳۰ روزه: ${Math.round((p * r * 30) / 365).toLocaleString()} ریال<br>
            سود ماه ۳۱ روزه: ${Math.round((p * r * 31) / 365).toLocaleString()} ریال<br>
            سود سالانه: ${Math.round(p * r).toLocaleString()} ریال
        `;
        document.getElementById('depResult').style.display = 'block';
    }
</script>
</body>
</html>
